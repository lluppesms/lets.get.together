# ----------------------------------------------------------------------------------------------------
# Variables for location of source for app
# ----------------------------------------------------------------------------------------------------
variables:
  - name: appFolderName
    value: 'src/web'
  - name: appSolutionName
    value: 'gettogether.net10.web'

  - name: appProjectFolderName
    value: 'Website'
  - name: appProjectName
    value: 'GetTogether.Web'
  - name: appProjectExtension
    value: 'csproj'

  - name: testFolderName 
    value: 'Tests'
  - name: testProjectName
    value: 'GetTogether.Tests'

  - name: buildPlatform
    value: 'Any CPU'
  - name: buildConfiguration
    value: 'Release'
  - name: runtime 
    value: 'win-x64'
