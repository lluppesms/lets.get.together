# ------------------------------------------------------------------------------------------------------------------------
# Project Configuration for GitHub Actions
# These values are used across multiple workflows to keep paths consistent
# ------------------------------------------------------------------------------------------------------------------------
# Usage in calling workflow:
#   jobs:
#     load-config:
#       uses: ./.github/workflows/template-load-config.yml
#     build-web:
#       needs: load-config
#       uses: ./.github/workflows/template-webapp-build.yml
#       with:
#         rootDirectory: ${{ needs.load-config.outputs.web_rootDirectory }}
#         projectName: ${{ needs.load-config.outputs.web_projectName }}
#     build-dacpac:
#       needs: load-config
#       uses: ./.github/workflows/template-dacpac-build.yml
#       with:
#         appFolderName: ${{ needs.load-config.outputs.sql_rootDirectory }}
#         appProjectName: ${{ needs.load-config.outputs.sql_projectName }}
# ------------------------------------------------------------------------------------------------------------------------

projects:
  # Web Application (Blazor)
  web:
    shortName: 'web'
    rootDirectory: 'src/web/Website'
    projectName: 'GetTogether.Web'
    testDirectory: 'src/web/Tests'
    testProjectName: 'GetTogether.Tests'

  # Azure Function App
  function:
    shortName: 'func'
    rootDirectory: 'src/function/Function'
    projectName: 'GetTogether.Function'
    testDirectory: 'src/function/Tests'
    testProjectName: 'GetTogether.Function.Tests'

  # Console Application
  console:
    shortName: 'console'
    rootDirectory: 'src/console'
    projectName: 'GetTogether.Console'
    testDirectory: ''
    testProjectName: ''

  # MCP (Model Context Protocol) Server
  mcp:
    shortName: 'mcp'
    rootDirectory: 'src/mcp/GetTogetherMCP'
    projectName: 'GetTogetherMCP'
    testDirectory: ''
    testProjectName: ''

  # MCP SSE Server
  mcpsse:
    shortName: 'mcpsse'
    rootDirectory: 'src/mcp/GetTogetherMCPSSE'
    projectName: 'GetTogetherMCPSSE'
    testDirectory: ''
    testProjectName: ''

  # GetTogether Analyzer
  analyzer:
    shortName: 'analyzer'
    rootDirectory: 'src/gettogetheranalyzer'
    projectName: 'GetTogetherAnalyzer'
    testDirectory: ''
    testProjectName: ''

  # SQL Database Project
  sql:
    shortName: 'sql'
    rootDirectory: 'src/sql.database'
    projectName: 'sql.database'
    solutionName: 'sql.database'
    testDirectory: ''
    testProjectName: ''
